<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Priorities | Good Business</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navigation -->
     <nav class="navbar navbar-expand-lg bg-light">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                <strong>GB</strong> GOOD BUSINESS</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="explore.html">Explore</a>
            </div>
        </div>
     </nav>

     <!-- Priority Selection -->
      <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">What matters to you?</h1>

            <p class="lead">Choose the priorities you care about when supporting a business.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="priority"
                        value="sustainability"
                        id="sustainability">

                        <label class="form-check-label" for="sustainability">
                            Sustainability
                        </label>
                </div>

                 <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="priority"
                        value="ownership"
                        id="ownership">
                        <label class="form-check-label" for="ownership">
                            Local Ownership
                        </label>
                </div>

                <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="priority"
                        value="community"
                        id="community">
                        <label class="form-check-label" for="community">
                            Community Involvement
                        </label>
                </div>

                <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="priority"
                        value="accessibility"
                        id="accessibility">
                        <label class="form-check-label" for="accessibility">
                            Accessibility
                        </label>
                </div>

                <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="priority"
                        value="civic"
                        id="civic">
                        <label class="form-check-label" for="civic">
                            Public & Civic Activity
                        </label>
                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="seeBusinesses"
                    >
                    See Businesses
                </button>

            </div>
        </div>
      </div>

<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script>

    const seeBusinessesButton = document.getElementById("seeBusinesses");

    seeBusinessesButton.addEventListener("click", function() {

        const selectedPriorities = [];

        const checkboxes = document.querySelectorAll(
            'input[name="priority"]:checked'
        );

        checkboxes.forEach(function(checkbox) {
            selectedPriorities.push(checkbox.value);
        });

        localStorage.setItem(
            "priorities",
            JSON.stringify(selectedPriorities)
        );

        window.location.href = "explore.html";

    });

</script>

</body>
</html>
